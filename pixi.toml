[workspace]
authors = ["K. S. Ernest (iFire) Lee <32321+fire@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "fabric"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
configure-accesskit = {cwd = "repositories/frontend", cmd = "python misc/scripts/install_accesskit.py" }
configure-dx12 = {cwd = "repositories/frontend", cmd = "python misc/scripts/install_d3d12_sdk_windows.py" }
build = { cmd = "scons precision=double production=yes debug_symbols=yes", cwd = "repositories/frontend", depends-on = ["configure-dx12", "configure-accesskit"]}

[dependencies]
python = "3.11.*"
scons = ">=4.11.1,<5"
